name: Kurse holen

on:
  schedule:
    - cron: "30 2 * * *"   # 02:30 UTC = 06:30 Tiflis, vor dem Morning Briefing um 07:45
  workflow_dispatch:

permissions:
  contents: write

jobs:
  kurse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance
      - run: python kurse_holen.py
        env:
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898579+github-actions[bot]@users.noreply.github.com"
          git add kurse.csv historie.csv
          git diff --cached --quiet || git commit -m "Kurse $(date -u +%Y-%m-%d)"
          git push
