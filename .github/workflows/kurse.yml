name: Kurse holen

on:
  schedule:
    # Mehrere Läufe, weil GitHub geplante Läufe oft um Stunden verschiebt (Briefing 07:45 Tiflis)
    - cron: "17 18,21,23 * * *"   # 22:17, 01:17, 03:17 Tiflis
    - cron: "17 1,2,3 * * *"      # 05:17, 06:17, 07:17 Tiflis
  workflow_dispatch:

permissions:
  contents: write

jobs:
  kurse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance
      - run: python kurse_holen.py
        env:
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898579+github-actions[bot]@users.noreply.github.com"
          git add kurse.csv historie.csv
          git diff --cached --quiet || git commit -m "Kurse $(date -u +%Y-%m-%d)"
          git push
